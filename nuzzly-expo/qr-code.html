<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuzzly - 扫码连接 Expo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #F5F3F1 0%, #E8DDD5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: 40px 48px;
    box-shadow: 0 8px 40px rgba(139,94,70,0.12);
    text-align: center;
    max-width: 440px;
  }
  .logo { font-size: 28px; margin-bottom: 8px; }
  .title { font-size: 22px; font-weight: 700; color: #8B5E46; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #7B7B7B; margin-bottom: 28px; }
  #qrcode { display: flex; justify-content: center; margin-bottom: 20px; }
  #qrcode canvas { border-radius: 12px; }
  .url-box {
    background: #F5F3F1;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .url-label { font-size: 12px; color: #7B7B7B; margin-bottom: 4px; }
  .url-value { font-size: 15px; color: #171717; font-family: monospace; word-break: break-all; }
  .instructions { text-align: left; }
  .instructions h3 { font-size: 14px; color: #8B5E46; margin-bottom: 10px; }
  .instructions ol { padding-left: 20px; }
  .instructions li { font-size: 13px; color: #555; line-height: 2; }
  .instructions li strong { color: #8B5E46; }
  .status { margin-top: 16px; font-size: 12px; color: #6C8A69; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6C8A69; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐾</div>
  <div class="title">Nuzzly 毛球镇</div>
  <div class="subtitle">用 Expo Go 扫描下方二维码即可打开 App</div>
  <div id="qrcode"></div>
  <div class="url-box">
    <div class="url-label">连接地址</div>
    <div class="url-value" id="url-display">exp://192.168.1.193:8081</div>
  </div>
  <div class="instructions">
    <h3>📋 使用步骤</h3>
    <ol>
      <li>手机安装 <strong>Expo Go</strong>（App Store / Google Play）</li>
      <li>确保手机和电脑连接<strong>同一个 WiFi</strong></li>
      <li>打开 Expo Go，点击<strong>扫描二维码</strong></li>
      <li>对准上方二维码扫描即可</li>
    </ol>
  </div>
  <div class="status">
    <div class="dot"></div>
    <span>Metro Bundler 运行中 · 等待连接</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  var url = 'exp://192.168.1.193:8081';
  new QRCode(document.getElementById('qrcode'), {
    text: url,
    width: 280,
    height: 280,
    colorDark: '#8B5E46',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
